<!DOCTYPE html>
<html>
<head>
    <title>Login Forms</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: white;
        }


        /* =====================================
           FORM 1 - FACEBOOK STYLE
           ===================================== */

        .facebook-section {
            min-height: 500px;
            background-color: #f0f2f5;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 150px;
            padding: 50px;
        }

        .facebook-left {
            width: 350px;
        }

        .facebook-logo {
            color: #1877f2;
            font-size: 46px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .facebook-text {
            font-size: 20px;
            line-height: 1.3;
            margin: 0;
        }

        .facebook-box {
            width: 340px;
            background-color: white;
            padding: 14px;

            border-radius: 8px;

            box-shadow: 0 3px 12px rgba(0,0,0,0.15);

            text-align: center;
        }

        .facebook-box input[type="text"],
        .facebook-box input[type="password"] {
            width: 100%;
            height: 38px;

            border: 1px solid #ddd;
            border-radius: 4px;

            padding: 10px;
            margin-bottom: 10px;

            font-size: 13px;
        }

        .login-button {
            width: 100%;
            height: 37px;

            border: none;
            border-radius: 4px;

            background-color: #1877f2;
            color: white;

            font-weight: bold;
            font-size: 14px;

            cursor: pointer;
        }

        .forgot {
            display: block;

            color: #1877f2;
            text-decoration: none;

            font-size: 11px;

            margin: 12px 0;
        }

        .line {
            border-top: 1px solid #ddd;
            margin: 12px 0 20px;
        }

        .create-button {
            background-color: #36a420;
            color: white;

            border: none;
            border-radius: 5px;

            padding: 10px 15px;

            font-weight: bold;
            cursor: pointer;
        }


        /* =====================================
           GAP
           ===================================== */

        .gap {
            height: 120px;
            background-color: white;
        }


        /* =====================================
           FORM 2 - SIGN IN / SIGN UP
           ===================================== */

        .signin-section {
            min-height: 550px;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: #111;
        }

        .signin-container {
            width: 680px;
            min-height: 430px;

            display: flex;

            background-color: white;

            border-radius: 5px;
            overflow: hidden;

            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }


        /* LEFT SIDE */

        .signin-left {
            width: 50%;
            padding: 50px 45px;

            text-align: center;

            background-color: white;
        }

        .signin-left h1 {
            margin: 0 0 20px;

            font-size: 30px;
        }

        .social-icons {
            margin-bottom: 12px;
        }

        .social-icons span {
            display: inline-flex;

            width: 32px;
            height: 32px;

            border: 1px solid #ddd;
            border-radius: 50%;

            justify-content: center;
            align-items: center;

            margin: 0 4px;

            font-weight: bold;
            color: #555;
        }

        .account-text {
            color: #777;
            font-size: 12px;

            margin-bottom: 10px;
        }

        .signin-input {
            width: 100%;
            height: 34px;

            border: none;

            background-color: #e9edf2;

            padding: 10px;

            margin-bottom: 12px;

            outline: none;
        }

        .forgot-password {
            color: #555;

            font-size: 13px;

            text-decoration: none;

            display: block;

            margin: 8px 0 15px;
        }

        .signin-button {
            background-color: #ff512f;

            color: white;

            border: none;

            border-radius: 20px;

            width: 125px;
            height: 36px;

            font-weight: bold;

            cursor: pointer;
        }


        /* RIGHT SIDE */

        .signup-side {
            width: 50%;

            background: linear-gradient(
                135deg,
                #ff512f,
                #ff2d2d
            );

            color: white;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 40px;
        }

        .signup-side h1 {
            font-size: 30px;

            margin-bottom: 10px;
        }

        .signup-side p {
            font-size: 13px;

            line-height: 1.5;

            margin-bottom: 25px;
        }

        .signup-button {
            width: 125px;
            height: 38px;

            border: 1px solid white;

            border-radius: 20px;

            background-color: transparent;

            color: white;

            font-weight: bold;

            cursor: pointer;
        }


        /* =====================================
           RESPONSIVE
           ===================================== */

        @media (max-width: 800px) {

            .facebook-section {
                flex-direction: column;
                gap: 40px;
            }

            .facebook-left {
                text-align: center;
            }

            .signin-container {
                width: 90%;
            }

        }

        @media (max-width: 600px) {

            .signin-container {
                flex-direction: column;
            }

            .signin-left,
            .signup-side {
                width: 100%;
            }

            .signin-section {
                padding: 30px 0;
            }

        }

    </style>
</head>


<body>


<!-- ==========================================
     DESIGN 1
     FACEBOOK STYLE LOGIN
     ========================================== -->

<section class="facebook-section">

    <div class="facebook-left">

        <div class="facebook-logo">
            facebook
        </div>

        <p class="facebook-text">
            Connect with friends and the world
            around you on Facebook.
        </p>

    </div>


    <div class="facebook-box">

        <form>

            <input
                type="text"
                placeholder="Email or phone number"
            >

            <input
                type="password"
                placeholder="Password"
            >

            <button class="login-button">
                Login
            </button>

            <a href="#" class="forgot">
                Forgot password?
            </a>

            <div class="line"></div>

            <button
                type="button"
                class="create-button"
            >
                Create new account
            </button>

        </form>

    </div>

</section>


<!-- GAP -->

<div class="gap"></div>


<!-- ==========================================
     DESIGN 2
     SIGN IN / SIGN UP
     ========================================== -->

<section class="signin-section">

    <div class="signin-container">


        <!-- LEFT: SIGN IN -->

        <div class="signin-left">

            <h1>
                Sign in
            </h1>


            <div class="social-icons">

                <span>f</span>
                <span>G+</span>
                <span>in</span>

            </div>


            <div class="account-text">
                or use your account
            </div>


            <form>

                <input
                    class="signin-input"
                    type="email"
                    placeholder="Email"
                >

                <input
                    class="signin-input"
                    type="password"
                    placeholder="Password"
                >

                <a
                    href="#"
                    class="forgot-password"
                >
                    Forgot your password?
                </a>

                <button class="signin-button">
                    SIGN IN
                </button>

            </form>

        </div>


        <!-- RIGHT: SIGN UP -->

        <div class="signup-side">

            <h1>
                Hello, Friend!
            </h1>

            <p>
                Enter your personal details and
                start your journey with us
            </p>

            <button class="signup-button">
                SIGN UP
            </button>

        </div>


    </div>

</section>


</body>
</html>
